<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Classroom Device Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="mainSidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>Dashboard</h1>
                <div id="lastUpdated" class="text-muted"></div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card" onclick="window.location.href='rooms.html'" style="cursor: pointer;">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalRooms">0</div>
                            <div class="stat-label">Total Classrooms</div>
                        </div>
                        <div class="stat-icon warning">
                            <i class="fas fa-door-open"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card" onclick="window.location.href='devices.html'" style="cursor: pointer;" title="View all devices">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalDevices">0</div>
                            <div class="stat-label">Total Devices</div>
                        </div>
                        <div class="stat-icon primary">
                            <i class="fas fa-desktop"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card" onclick="window.location.href='rooms.html'" style="cursor: pointer;" title="View lab rooms">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="labRooms">0</div>
                            <div class="stat-label">LAB Rooms</div>
                        </div>
                        <div class="stat-icon success">
                            <i class="fas fa-flask"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card" onclick="navigateToWithdrawnDevices()" style="cursor: pointer;" title="View withdrawn devices">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="withdrawnDevices">0</div>
                            <div class="stat-label">Withdrawn Devices</div>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
                            <i class="fas fa-arrow-down"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card" onclick="navigateToAvailableDevices()" style="cursor: pointer;" title="View available devices">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="availableDevices">0</div>
                            <div class="stat-label">Available Devices</div>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);">
                            <i class="fas fa-box"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card" onclick="window.location.href='gate-passes.html'" style="cursor: pointer;" title="View all gate passes">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-value" id="totalGatePasses">0</div>
                            <div class="stat-label">Gate Passes</div>
                        </div>
                        <div class="stat-icon" style="background: linear-gradient(135deg, #1a87be 0%, #2a285a 100%);">
                            <i class="fas fa-file-alt"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Devices by Type Chart -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Devices by Type</h3>
                </div>
                <div id="devicesByTypeContainer">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Available Devices by Type Chart -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Available Devices by Type</h3>
                </div>
                <div id="availableDevicesByTypeContainer">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Recent Activities -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Recent Activities</h3>
                </div>
                <div class="table-container">
                    <table id="recentActivitiesTable">
                        <thead>
                            <tr>
                                <th>Action</th>
                                <th>Table</th>
                                <th>User</th>
                                <th>Date & Time</th>
                            </tr>
                        </thead>
                        <tbody id="recentActivitiesBody">
                            <tr>
                                <td colspan="4" class="text-center">
                                    <div class="spinner"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js?v=2"></script>
    <script src="js/dashboard.js?v=4"></script>
</body>
</html>
