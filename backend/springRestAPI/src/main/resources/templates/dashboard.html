<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Dashboard')}"></head>
<body>
<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="mainSidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-header">
            <h1><i class="fas fa-home" style="color:var(--color-mid);margin-right:8px;"></i>Dashboard</h1>
            <div id="lastUpdated" class="text-muted"></div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card" onclick="window.location.href='/rooms'" style="cursor:pointer;" title="View classrooms">
                <div class="stat-card-header">
                    <div>
                        <div class="stat-value" id="totalRooms">—</div>
                        <div class="stat-label">Total Classrooms</div>
                    </div>
                    <div class="stat-icon warning"><i class="fas fa-door-open"></i></div>
                </div>
            </div>

            <div class="stat-card" onclick="window.location.href='/devices'" style="cursor:pointer;" title="View all devices">
                <div class="stat-card-header">
                    <div>
                        <div class="stat-value" id="totalDevices">—</div>
                        <div class="stat-label">Total Devices</div>
                    </div>
                    <div class="stat-icon primary"><i class="fas fa-desktop"></i></div>
                </div>
            </div>

            <div class="stat-card" onclick="window.location.href='/rooms'" style="cursor:pointer;" title="View lab rooms">
                <div class="stat-card-header">
                    <div>
                        <div class="stat-value" id="labRooms">—</div>
                        <div class="stat-label">LAB Rooms</div>
                    </div>
                    <div class="stat-icon success"><i class="fas fa-flask"></i></div>
                </div>
            </div>

            <div class="stat-card" onclick="navigateToWithdrawnDevices()" style="cursor:pointer;" title="View withdrawn devices">
                <div class="stat-card-header">
                    <div>
                        <div class="stat-value" id="withdrawnDevices">—</div>
                        <div class="stat-label">Withdrawn Devices</div>
                    </div>
                    <div class="stat-icon danger"><i class="fas fa-arrow-down"></i></div>
                </div>
            </div>

            <div class="stat-card" onclick="navigateToAvailableDevices()" style="cursor:pointer;" title="View available devices">
                <div class="stat-card-header">
                    <div>
                        <div class="stat-value" id="availableDevices">—</div>
                        <div class="stat-label">Available Devices</div>
                    </div>
                    <div class="stat-icon info"><i class="fas fa-box"></i></div>
                </div>
            </div>

            <div class="stat-card" onclick="window.location.href='/gate-passes'" style="cursor:pointer;" title="View gate passes">
                <div class="stat-card-header">
                    <div>
                        <div class="stat-value" id="totalGatePasses">—</div>
                        <div class="stat-label">Gate Passes</div>
                    </div>
                    <div class="stat-icon primary"><i class="fas fa-file-alt"></i></div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-bottom:24px;">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-chart-bar" style="color:var(--color-mid);margin-right:6px;"></i>Devices by Type</h3>
                </div>
                <div id="devicesByTypeContainer">
                    <div class="loading"><div class="spinner"></div> Loading…</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-chart-bar" style="color:var(--success-color);margin-right:6px;"></i>Available Devices by Type</h3>
                </div>
                <div id="availableDevicesByTypeContainer">
                    <div class="loading"><div class="spinner"></div> Loading…</div>
                </div>
            </div>
        </div>

        <!-- Recent Activities -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-history" style="color:var(--color-mid);margin-right:6px;"></i>Recent Activities</h3>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Table</th>
                            <th>User</th>
                            <th>Date &amp; Time</th>
                        </tr>
                    </thead>
                    <tbody id="recentActivitiesBody">
                        <tr><td colspan="4" class="text-center"><div class="loading"><div class="spinner"></div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/scripts :: common-scripts}"></div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
