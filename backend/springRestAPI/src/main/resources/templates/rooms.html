<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Rooms')}"></head>
<body>
<div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar"></aside>

    <main class="main-content">
        <div class="content-header">
            <h1><i class="fas fa-door-open" style="color:var(--color-mid);margin-right:8px;"></i>Room Management</h1>
            <button class="btn btn-primary" onclick="showAddRoomModal()">
                <i class="fas fa-plus"></i> Add Room
            </button>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom:24px;">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end;">
                <div class="form-group" style="margin-bottom:0;">
                    <label for="buildingFilter"><i class="fas fa-building"></i> Building</label>
                    <select id="buildingFilter" onchange="applyFilters()">
                        <option value="">All Buildings</option>
                        <option value="NAC">NAC – North Academic</option>
                        <option value="SAC">SAC – South Academic</option>
                        <option value="NTR">NTR – North Tower</option>
                        <option value="LIB">LIB – Library</option>
                        <option value="LAB">LAB – Laboratory</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="floorFilter"><i class="fas fa-layer-group"></i> Floor</label>
                    <select id="floorFilter" onchange="applyFilters()">
                        <option value="">All Floors</option>
                        <option value="0">Ground Floor (0)</option>
                        <option value="2">2nd Floor</option>
                        <option value="3">3rd Floor</option>
                        <option value="4">4th Floor</option>
                        <option value="5">5th Floor</option>
                        <option value="6">6th Floor</option>
                        <option value="7">7th Floor</option>
                        <option value="8">8th Floor</option>
                        <option value="9">9th Floor</option>
                        <option value="1">10th Floor</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="searchFilter"><i class="fas fa-search"></i> Search</label>
                    <input type="text" id="searchFilter" placeholder="Search room number or name…" oninput="applyFilters()">
                </div>
                <div>
                    <button class="btn btn-secondary btn-sm" onclick="clearFilters()" style="width:100%;">
                        <i class="fas fa-times"></i> Clear Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Rooms Grid -->
        <div class="stats-grid" id="roomsGrid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr));">
        <div style="grid-column:1/-1;" class="loading"><div class="spinner"></div> Loading rooms…</div>
    </div>
    </main>
</div>

<!-- Add/Edit Room Modal -->
<div id="roomModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="roomModalTitle"><i class="fas fa-door-open"></i> Add Room</h3>
            <button class="modal-close" onclick="closeRoomModal()"><i class="fas fa-times"></i></button>
        </div>
        <form id="roomForm">
            <input type="hidden" id="roomId">
            <div class="form-group">
                <label for="roomNumber">Room Number *</label>
                <input type="text" id="roomNumber" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="roomName">Room Name *</label>
                <input type="text" id="roomName" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="building">Building</label>
                <input type="text" id="building" class="form-control">
            </div>
            <div class="form-group">
                <label for="floor">Floor</label>
                <input type="text" id="floor" class="form-control">
            </div>
            <div class="form-group">
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" class="form-control" min="1">
            </div>
        </form>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeRoomModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveRoom()"><i class="fas fa-save"></i> Save</button>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-exclamation-triangle" style="color:var(--danger-color);"></i> Delete Room</h3>
            <button class="modal-close" onclick="closeDeleteModal()"><i class="fas fa-times"></i></button>
        </div>
        <p>Are you sure you want to delete this room?</p>
        <p class="text-muted mt-2"><strong id="deleteRoomName"></strong></p>
        <p class="mt-2" style="color:var(--warning-color);font-size:0.88rem;">
            <i class="fas fa-info-circle"></i> Room will be moved to deleted items and can be restored later.
        </p>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn btn-danger" onclick="confirmDelete()"><i class="fas fa-trash"></i> Delete</button>
        </div>
    </div>
</div>

<!-- Room Devices Modal -->
<div id="devicesModal" class="modal-overlay">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3><i class="fas fa-desktop"></i> Devices in <span id="devicesRoomName"></span></h3>
            <button class="modal-close" onclick="closeDevicesModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="devicesListContainer">
            <div class="loading"><div class="spinner"></div> Loading…</div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="closeDevicesModal()">Close</button></div>
    </div>
</div>

<!-- Device History Modal -->
<div id="deviceHistoryModal" class="modal-overlay">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3><i class="fas fa-history"></i> Device History: <span id="historyDeviceId"></span></h3>
            <button class="modal-close" onclick="closeDeviceHistoryModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="deviceHistoryContainer">
            <div class="loading"><div class="spinner"></div> Loading…</div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="closeDeviceHistoryModal()">Close</button></div>
    </div>
</div>

<div id="alert-container" style="position:fixed;bottom:24px;right:24px;z-index:999;min-width:280px;"></div>

<div th:replace="~{fragments/scripts :: common-scripts}"></div>
<script th:src="@{/js/rooms.js}"></script>
</body>
</html>
