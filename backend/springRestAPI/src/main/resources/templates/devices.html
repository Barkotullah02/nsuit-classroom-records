<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Devices')}"></head>
<body>
<div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar"></aside>

    <main class="main-content">
        <div class="content-header">
            <h1><i class="fas fa-desktop" style="color:var(--color-mid);margin-right:8px;"></i>Device Management</h1>
            <button class="btn btn-primary" id="addDeviceBtn">
                <i class="fas fa-plus"></i> Add Device
            </button>
        </div>

        <!-- Filters -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Filters</h3>
                <button class="btn btn-secondary btn-sm" id="clearFiltersBtn">Clear Filters</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label for="filterDeviceId">Device ID (NSU ID)</label>
                    <input type="text" id="filterDeviceId" placeholder="Search by device ID">
                </div>
                <div class="filter-group">
                    <label for="filterType">Device Type</label>
                    <select id="filterType">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterBrand">Brand</label>
                    <select id="filterBrand">
                        <option value="">All Brands</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="NEW">New</option>
                        <option value="REPAIR">Repair</option>
                        <option value="USED">Used</option>
                        <option value="WITHDRAWN">Withdrawn</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterRoom">Current Room</label>
                    <select id="filterRoom">
                        <option value="">All Rooms</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Devices List</h3>
                <span id="deviceCount" class="text-muted text-small"></span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Device ID (NSU ID)</th>
                            <th>Type</th>
                            <th>Brand</th>
                            <th>Model</th>
                            <th>Serial No.</th>
                            <th>Status</th>
                            <th>Current Room</th>
                            <th>Issue</th>
                            <th>Storage</th>
                            <th>Total Lifetime</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="devicesTableBody">
                        <tr><td colspan="11" class="text-center"><div class="loading"><div class="spinner"></div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Add/Edit Device Modal -->
<div id="deviceModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Add Device</h3>
            <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <form id="deviceForm">
            <input type="hidden" id="deviceId">
            <div class="form-group">
                <label for="deviceUniqueId">Device Unique ID *</label>
                <input type="text" id="deviceUniqueId" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="typeId">Device Type *</label>
                <div style="display:flex;gap:8px;">
                    <select id="typeId" class="form-control" required style="flex:1;">
                        <option value="">Select Type</option>
                    </select>
                    <button type="button" class="btn btn-secondary btn-sm" id="addTypeBtn" style="display:none;" title="Add new device type">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="brandId">Brand *</label>
                <div style="display:flex;gap:8px;">
                    <select id="brandId" class="form-control" required style="flex:1;">
                        <option value="">Select Brand</option>
                    </select>
                    <button type="button" class="btn btn-secondary btn-sm" id="addBrandBtn" style="display:none;" title="Add new brand">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" class="form-control">
            </div>
            <div class="form-group">
                <label for="serialNumber">Serial Number (Manufacture SL)</label>
                <input type="text" id="serialNumber" class="form-control" placeholder="e.g., VWJ2241B01148">
                <small class="text-muted">Manufacturer Serial Number</small>
            </div>
            <div class="form-group">
                <label for="deviceStatus">Device Status</label>
                <select id="deviceStatus" class="form-control">
                    <option value="NEW">New</option>
                    <option value="REPAIR">Repair</option>
                    <option value="USED">Used</option>
                    <option value="WITHDRAWN">Withdrawn</option>
                </select>
            </div>
            <div class="form-group">
                <label for="currentIssue">Current Issue (Optional)</label>
                <select id="currentIssue" class="form-control">
                    <option value="">No Issue</option>
                </select>
            </div>
            <div class="form-group">
                <label for="storageLocation">Storage Location (Optional)</label>
                <select id="storageLocation" class="form-control">
                    <option value="">Not Stored</option>
                </select>
            </div>
            <div class="form-group">
                <label for="purchaseDate">Purchase Date</label>
                <input type="date" id="purchaseDate" class="form-control">
            </div>
            <div class="form-group">
                <label for="warrantyPeriod">Warranty Period (months)</label>
                <input type="number" id="warrantyPeriod" class="form-control" min="0">
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group" id="isActiveGroup" style="display:none;">
                <label>
                    <input type="checkbox" id="isActive" checked> Device is Active
                </label>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Device</button>
            </div>
        </form>
    </div>
</div>

<!-- Device History Modal -->
<div id="historyModal" class="modal-overlay">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3><i class="fas fa-history"></i> Device History</h3>
            <button class="modal-close" id="closeHistoryModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <div id="historyContent">
            <div class="loading"><div class="spinner"></div> Loading…</div>
        </div>
    </div>
</div>

<!-- Add Brand Modal -->
<div id="addBrandModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-copyright"></i> Add New Brand</h3>
            <button class="modal-close" id="closeAddBrandModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <form id="addBrandForm">
            <div class="form-group">
                <label for="newBrandName">Brand Name *</label>
                <input type="text" id="newBrandName" class="form-control" placeholder="e.g., Dell, HP, Logitech" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelAddBrandBtn">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Brand</button>
            </div>
        </form>
    </div>
</div>

<!-- Add Device Type Modal -->
<div id="addDeviceTypeModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-laptop"></i> Add New Device Type</h3>
            <button class="modal-close" id="closeAddDeviceTypeModalBtn"><i class="fas fa-times"></i></button>
        </div>
        <form id="addDeviceTypeForm">
            <div class="form-group">
                <label for="newTypeName">Device Type Name *</label>
                <input type="text" id="newTypeName" class="form-control" placeholder="e.g., Projector, Monitor" required>
            </div>
            <div class="form-group">
                <label for="newTypeDescription">Description</label>
                <textarea id="newTypeDescription" class="form-control" rows="3" placeholder="Optional description"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelAddDeviceTypeBtn">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Device Type</button>
            </div>
        </form>
    </div>
</div>

<div id="alert-container" style="position:fixed;bottom:24px;right:24px;z-index:999;min-width:280px;"></div>

<div th:replace="~{fragments/scripts :: common-scripts}"></div>
<script th:src="@{/js/devices.js}"></script>
</body>
</html>
