<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Invalid Installation Dates')}"></head>
<body>
<div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar"></aside>
    <main class="main-content">
        <div class="page-header">
            <h1><i class="fas fa-calendar-times"></i> Invalid Installation Dates</h1>
        </div>

        <div id="alert-container"></div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Records with Invalid Dates</h3>
                <button class="btn btn-secondary btn-sm" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Installation ID</th>
                            <th>Device</th>
                            <th>Room</th>
                            <th>Installed Date</th>
                            <th>Withdrawn Date</th>
                            <th>Gate Pass Date</th>
                            <th>Status</th>
                            <th>Invalid Reason</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invalidInstallationsTableBody">
                        <tr><td colspan="9" class="text-center"><div class="spinner"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Edit Dates Modal -->
<div id="editDatesModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Update Installation Dates</h2>
            <button class="btn-close" id="closeEditDatesModalBtn">&times;</button>
        </div>
        <form id="editDatesForm">
            <input type="hidden" id="editInstallationId">
            <div id="editDeviceInfo" style="margin-bottom:1rem;"></div>
            <div class="form-group">
                <label for="editInstalledDate">Installed Date</label>
                <input type="date" id="editInstalledDate">
            </div>
            <div class="form-group">
                <label for="editWithdrawnDate">Withdrawn Date</label>
                <input type="date" id="editWithdrawnDate">
            </div>
            <div class="form-group">
                <label for="editGatePassDate">Gate Pass Date</label>
                <input type="date" id="editGatePassDate">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelEditDatesBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Update Dates</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/scripts :: common-scripts}"></div>
<script src="/js/invalid-installation-dates.js"></script>
</body>
</html>
