<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Blog &amp; News')}"></head>
<style>
    .blog-container { display:grid; grid-template-columns:1fr 350px; gap:30px; padding:20px; }
    .search-filter-bar { display:flex; gap:15px; margin-bottom:30px; flex-wrap:wrap; }
    .search-box { flex:1; min-width:300px; position:relative; }
    .search-box input { width:100%; padding:12px 40px 12px 15px; border:1px solid rgba(255,255,255,0.2); border-radius:8px; font-size:14px; background:var(--card-bg); color:white; }
    .search-box .fa-search { position:absolute; right:15px; top:50%; transform:translateY(-50%); opacity:0.5; }
    .category-filter { display:flex; gap:10px; flex-wrap:wrap; }
    .category-btn { padding:8px 16px; border:1px solid rgba(255,255,255,0.2); background:var(--card-bg); border-radius:20px; cursor:pointer; transition:all 0.3s; font-size:13px; color:white; }
    .category-btn:hover, .category-btn.active { background:var(--color-dark); border-color:var(--color-mid); }
    .post-card { background:var(--card-bg); border-radius:12px; overflow:hidden; margin-bottom:25px; box-shadow:0 2px 8px rgba(0,0,0,0.2); transition:all 0.3s; cursor:pointer; }
    .post-card:hover { transform:translateY(-4px); box-shadow:0 4px 16px rgba(0,0,0,0.3); }
    .post-featured { height:200px; overflow:hidden; background:linear-gradient(135deg,var(--color-dark),var(--color-mid)); position:relative; }
    .post-featured img { width:100%; height:100%; object-fit:cover; }
    .post-category-badge { position:absolute; top:15px; left:15px; padding:4px 12px; background:rgba(255,255,255,0.95); border-radius:12px; font-size:11px; font-weight:600; color:var(--color-dark); }
    .post-pinned-badge { position:absolute; top:15px; right:15px; padding:4px 12px; background:#f59e0b; border-radius:12px; font-size:11px; font-weight:600; color:white; }
    .post-content { padding:20px; }
    .post-title { font-size:20px; font-weight:600; margin-bottom:10px; line-height:1.4; }
    .post-excerpt { opacity:0.75; font-size:14px; line-height:1.6; margin-bottom:15px; }
    .post-meta { display:flex; align-items:center; gap:20px; font-size:13px; opacity:0.7; }
    .post-meta-item { display:flex; align-items:center; gap:5px; }
    .sidebar-section { background:var(--card-bg); border-radius:12px; padding:20px; margin-bottom:20px; }
    .sidebar-title { font-size:18px; font-weight:600; margin-bottom:15px; display:flex; align-items:center; gap:8px; }
    .popular-post { padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.1); cursor:pointer; transition:all 0.2s; }
    .popular-post:last-child { border-bottom:none; }
    .popular-post:hover { background:rgba(255,255,255,0.05); margin:0 -12px; padding:12px; border-radius:8px; }
    .popular-post-title { font-size:14px; font-weight:500; margin-bottom:5px; line-height:1.4; }
    .popular-post-meta { font-size:12px; opacity:0.6; }
    .pagination { display:flex; justify-content:center; gap:10px; margin-top:30px; }
    .page-btn { padding:8px 16px; border:1px solid rgba(255,255,255,0.2); background:var(--card-bg); border-radius:8px; cursor:pointer; transition:all 0.3s; color:white; }
    .page-btn:hover, .page-btn.active { background:var(--color-dark); border-color:var(--color-mid); }
    .no-posts { text-align:center; padding:60px 20px; opacity:0.5; }
    @media (max-width: 1024px) { .blog-container { grid-template-columns:1fr; } }
</style>
<body>
<div class="dashboard-container">
    <aside class="sidebar" id="mainSidebar"></aside>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-newspaper"></i> Blog &amp; News</h1>
                <p>Latest updates, announcements, and articles</p>
            </div>
            <button class="btn btn-primary" id="createPostBtn" style="display:none;">
                <i class="fas fa-plus"></i> Create Post
            </button>
        </div>

        <div class="blog-container">
            <div class="blog-main">
                <div class="search-filter-bar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search posts...">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <div class="category-filter" id="categoryFilter">
                    <button class="category-btn active" data-category="">All</button>
                </div>
                <div id="postsContainer" style="margin-top:30px;">
                    <div style="text-align:center;padding:40px;"><div class="spinner"></div></div>
                </div>
                <div id="pagination" class="pagination"></div>
            </div>
            <div class="blog-sidebar">
                <div class="sidebar-section">
                    <h3 class="sidebar-title"><i class="fas fa-fire"></i> Popular Posts</h3>
                    <div id="popularPosts">
                        <div style="text-align:center;padding:20px;"><div class="spinner" style="width:30px;height:30px;"></div></div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3 class="sidebar-title"><i class="fas fa-tags"></i> Categories</h3>
                    <div id="categoriesStats"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/scripts :: common-scripts}"></div>
<script src="/js/blog.js"></script>
</body>
</html>
