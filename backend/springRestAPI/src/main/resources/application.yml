spring:
  application:
    name: classroom-records-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/classroom_devices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL}
    username: ${SPRING_DATASOURCE_USERNAME:classroommysqlserver}
    password: ${SPRING_DATASOURCE_PASSWORD:classroomubuntumysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://10.100.6.191,http://127.0.0.1,http://localhost}
  jwt:
    secret: ${APP_JWT_SECRET:your-secret-key-change-this-in-production-2025}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:24}
